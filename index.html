<!-- index.html (REPLACES your entire index.html file to restore the original host screen) -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Host Screen</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .host-card {
            background-color: #1e1e2f;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            width: 400px;
        }
        h1 {
            color: #ff3366;
            margin-bottom: 20px;
        }
        .room-code {
            font-size: 2.5rem;
            letter-spacing: 8px;
            color: #00e5ff;
            margin: 20px 0;
        }
        .btn-start {
            background-color: #ff3366;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="host-card">
        <div style="text-align: right; margin-bottom: 10px;">
            <button style="background: #2a2a3f; color: white; border: none; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem;">🔊 Audio: ON</button>
        </div>
        <h1>HOST SCREEN</h1>
        <p>Join at this URL on your phone!</p>
        <p>ROOM CODE:</p>
        <div class="room-code">- - - -</div>
        <p>Players Joined:</p>
        <button class="btn-start">Start Game</button>
    </div>
</body>
</html>
