<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluff Master</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: #ffffff; 
            text-align: center; 
            margin: 0; 
            padding: 40px 20px; 
        }
        .hidden { display: none !important; }
        button { 
            background: #e50914; 
            border: none; 
            padding: 14px 28px; 
            font-size: 18px; 
            font-weight: bold; 
            color: #ffffff;
            cursor: pointer; 
            border-radius: 8px; 
            margin: 12px; 
            transition: background 0.2s ease, transform 0.1s ease;
        }
        button:hover { 
            background: #f40612;
            transform: scale(1.02);
        }
        input { 
            padding: 14px; 
            font-size: 16px; 
            border-radius: 6px; 
            border: 2px solid #333; 
            background: #1e1e1e;
            color: #fff;
            width: 80%; 
            max-width: 320px; 
            margin: 10px; 
            outline: none;
            text-align: center;
        }
        input:focus {
            border-color: #e50914;
        }
        .card { 
            background: #1a1a1a; 
            padding: 40px 30px; 
            border-radius: 12px; 
            display: inline-block; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.8); 
            max-width: 500px; 
            width: 100%; 
            border: 1px solid #333;
        }
        h1 {
            color: #e50914;
            margin-bottom: 5px;
        }
        p {
            color: #b0b0b0;
        }
    </style>
</head>
<body>

    <div id="app">
        <!-- LOBBY SCREEN -->
        <div id="lobby-screen" class="card">
            <h1>Bluff Master</h1>
            <p>An adult-themed party bluffing game</p>
            <div id="menu-options">
                <button onclick="showCreateRoom()">Create Room</button>
                <br>
                <input type="text" id="room-code-input" placeholder="ROOM CODE (E.G. ABCD)" maxlength="4" style="text-transform: uppercase;">
                <br>
                <input type="text" id="player-name-input" placeholder="Your Name" maxlength="15">
                <br>
                <button onclick="joinRoom()">Join Room</button>
            </div>
        </div>

        <!-- WAITING ROOM / HOST SCREEN -->
        <div id="room-screen" class="card hidden">
            <h2 id="display-room-code" style="color: #e50914;">Room: </h2>
            <h3>Players in Room:</h3>
            <ul id="players-list" style="list-style: none; padding: 0; font-size: 18px;"></ul>
            <div id="host-controls" class="hidden">
                <button onclick="startRound()">Start Game / Next Round</button>
            </div>
            <p id="waiting-msg" class="hidden">Waiting for host to start...</p>
        </div>

        <!-- SUBMITTING LIE SCREEN -->
        <div id="submit-screen" class="card hidden">
            <h2 id="round-title" style="color: #e50914;">Round 1</h2>
            <p id="question-prompt" style="font-size: 20px; font-weight: bold; color: #fff;"></p>
            <p>Type a believable lie so other players vote for it!</p>
            <input type="text" id="lie-input" placeholder="Your fake answer..." maxlength="30">
            <br>
            <button onclick="submitLie()">Submit Lie</button>
            <p id="timer-display" style="font-size: 18px; font-weight: bold; color: #e50914;">Time Left: 45s</p>
        </div>

        <!-- VOTING SCREEN -->
        <div id="voting-screen" class="card hidden">
            <h2 style="color: #e50914;">Vote for the Truth!</h2>
            <div id="voting-options"></div>
            <p id="vote-timer-display" style="font-size: 18px; font-weight: bold; color: #e50914;">Time Left: 45s</p>
        </div>

        <!-- REVEAL SCREEN -->
        <div id="reveal-screen" class="card hidden">
            <h2 style="color: #e50914;">Round Results</h2>
            <p>The real truth was:</p>
            <h3 id="reveal-truth" style="font-size: 24px; color: #4CAF50;"></h3>
            <div id="reveal-scores"></div>
            <br>
            <button onclick="startRound()">Continue to Next Round</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoomCode = '';

        function showCreateRoom() {
            socket.emit('createRoom');
        }

        socket.on('roomCreated', ({ roomCode }) => {
            currentRoomCode = roomCode;
            document.getElementById('display-room-code').innerText = 'Room: ' + roomCode;
            document.getElementById('host-controls').classList.remove('hidden');
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
        });

        function joinRoom() {
            const code = document.getElementById('room-code-input').value.toUpperCase();
            const name = document.getElementById('player-name-input').value;
            if (!code || !name) {
                alert('Please enter both room code and your name.');
                return;
            }
            currentRoomCode = code;
            socket.emit('joinRoom', { roomCode: code, name: name });
        }

        socket.on('joinedSuccess', ({ roomCode }) => {
            document.getElementById('display-room-code').innerText = 'Room: ' + roomCode;
            document.getElementById('waiting-msg').classList.remove('hidden');
            document.getElementById('host-controls').classList.remove('hidden');
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('room-screen').classList.remove('hidden');
        });

        socket.on('updatePlayers', (players) => {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            players.forEach(p => {
                const li = document.createElement('li');
                li.innerText = p.name + (p.score ? ` (${p.score} pts)` : '');
                li.style.margin = '8px 0';
                list.appendChild(li);
            });
        });

        function startRound() {
            socket.emit('startRound', currentRoomCode);
        }

        socket.on('newRound', ({ question, currentRound }) => {
            document.getElementById('round-title').innerText = 'Round ' + currentRound;
            document.getElementById('question-prompt').innerText = question;
            document.getElementById('lie-input').value = '';
            document.getElementById('room-screen').classList.add('hidden');
            document.getElementById('reveal-screen').classList.add('hidden');
            document.getElementById('submit-screen').classList.remove('hidden');
        });

        function submitLie() {
            const lie = document.getElementById('lie-input').value;
            if (!lie) {
                alert('Please type a lie!');
                return;
            }
            socket.emit('submitLie', { roomCode: currentRoomCode, lie: lie });
            document.getElementById('submit-screen').innerHTML = '<h2 style="color: #e50914;">Lie submitted!</h2><p>Waiting for other players...</p>';
        }

        socket.on('startVoting', ({ options }) => {
            const container = document.getElementById('voting-options');
            container.innerHTML = '';
            options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.innerText = opt.text;
                btn.style.display = 'block';
                btn.style.width = '100%';
                btn.style.margin = '10px 0';
                btn.onclick = () => submitVote(index);
                container.appendChild(btn);
            });
            document.getElementById('submit-screen').classList.add('hidden');
            document.getElementById('voting-screen').classList.remove('hidden');
        });

        function submitVote(optionIndex) {
            socket.emit('submitVote', { roomCode: currentRoomCode, optionIndex: optionIndex });
            document.getElementById('voting-screen').innerHTML = '<h2 style="color: #e50914;">Vote submitted!</h2><p>Waiting for round results...</p>';
        }

        socket.on('showReveal', ({ truth, players }) => {
            document.getElementById('reveal-truth').innerText = truth;
            const scoreDiv = document.getElementById('reveal-scores');
            scoreDiv.innerHTML = '<h3 style="color: #fff;">Scores:</h3>';
            Object.values(players).forEach(p => {
                scoreDiv.innerHTML += `<p style="font-size: 18px; color: #b0b0b0;">${p.name}: <strong style="color: #e50914;">${p.score || 0}</strong> points</p>`;
            });
            document.getElementById('voting-screen').classList.add('hidden');
            document.getElementById('reveal-screen').classList.remove('hidden');
        });

        socket.on('timerUpdate', ({ timeLeft }) => {
            const el = document.getElementById('timer-display');
            if (el) el.innerText = 'Time Left: ' + timeLeft + 's';
        });

        socket.on('errorMsg', (msg) => {
            alert(msg);
        });
    </script>
</body>
</html>
